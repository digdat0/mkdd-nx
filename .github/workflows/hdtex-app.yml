# Builds the HD texture app (tools/hdtex_app): MKDD-NX-HD-Textures.exe (Windows) and .dmg (macOS,
# Apple Silicon and Intel). Run it from the Actions tab with a release tag to attach the apps to that
# release, or without one to only keep them as workflow artifacts. Publishing a release also runs it.
# The apps contain no game code or data.
name: HD texture app

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the apps to (empty: artifacts only)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packaging tools
        run: python -m pip install -r tools/hdtex_app/requirements.txt
      - name: Build the app
        run: python tools/hdtex_app/build_app.py
      - name: Check the packaged converter (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python - <<'EOF'
          from pathlib import Path
          from PIL import Image
          d = Path("ci-pack/GM4E01"); d.mkdir(parents=True)
          Image.new("RGBA", (64, 32), (200, 40, 40, 255)).save(d / "tex1_16x8_0123456789abcdef_14.png")
          EOF
          ./dist/MKDD-NX-HD-Textures.exe --convert ci-pack ci-out/hd-textures.bin
          test -s ci-out/hd-textures.bin
      - name: Check the packaged converter (macOS)
        if: runner.os == 'macOS'
        run: |
          python - <<'EOF'
          from pathlib import Path
          from PIL import Image
          d = Path("ci-pack/GM4E01"); d.mkdir(parents=True)
          Image.new("RGBA", (64, 32), (200, 40, 40, 255)).save(d / "tex1_16x8_0123456789abcdef_14.png")
          EOF
          "build-hdtex-app/dist/MKDD-NX HD Textures.app/Contents/MacOS/MKDD-NX HD Textures" --convert ci-pack ci-out/hd-textures.bin
          test -s ci-out/hd-textures.bin
      - uses: actions/upload-artifact@v4
        with:
          name: hdtex-app-${{ matrix.os }}
          path: dist/*
      - name: Attach to the release
        if: github.event_name == 'release' || inputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" dist/* --clobber
