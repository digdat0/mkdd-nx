<!doctype html>
<html><head><meta charset="utf-8"><title>Kart FPV Mock</title>
<style>
:root{color-scheme:dark}
body{margin:0;background:#15171c;color:#e8e8e8;font:14px system-ui,sans-serif;padding:16px}
main{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
#wrap{flex:1 1 480px;min-width:0;max-width:1120px}
#view{position:relative;width:min(1120px,100%);aspect-ratio:16/9;overflow:hidden;background:linear-gradient(#1b3f94 50%,#55524e 50%);border-radius:6px}
#bg,#gl{position:absolute;left:0;top:0;width:100%;height:100%}
#bg{object-fit:cover}
#side{flex:0 0 300px}
label{display:block;margin:12px 0 2px}
.row{display:flex;gap:8px;align-items:center}
input[type=range]{flex:1}
input[type=number]{width:60px;background:#23262d;color:inherit;border:1px solid #444;border-radius:4px;padding:3px}
select,button{background:#23262d;color:inherit;border:1px solid #444;border-radius:4px;padding:5px 8px}
select{flex:1}
button{cursor:pointer}
button:hover{background:#30343d}
textarea{width:100%;box-sizing:border-box;height:190px;background:#23262d;color:inherit;border:1px solid #444;border-radius:4px;font:12px monospace}
small{color:#9aa0aa}
.changed{color:#ffd166}
</style></head><body>
<main><div id="wrap"><div id="view"><img id="bg" alt=""><canvas id="gl" width="1280" height="720"></canvas></div></div>
<div id="side">
  <div class="row"><button id="prev">&lt;</button><select id="kart"></select><button id="next">&gt;</button></div>
  <label>Height</label><div class="row"><input type="range" id="up" min="0" max="300"><input type="number" id="upn"></div>
  <label>Forward</label><div class="row"><input type="range" id="fwd" min="-150" max="150"><input type="number" id="fwdn"></div>
  <label>Tilt (degrees down)</label><div class="row"><input type="range" id="tilt" min="-20" max="45"><input type="number" id="tiltn"></div>
  <label>Field of view</label><select id="fov" style="width:100%">
    <option value="1">NORMAL</option><option value="1.15">WIDE</option><option value="1.3" selected>WIDER (16:9 default)</option><option value="1.45">WIDEST</option><option value="2">WIDEEE</option></select>
  <p class="row"><button id="reset">Reset this kart</button><button id="copy">Copy changes</button></p>
  <small>Arrow keys: up/down height, left/right forward. Q/E tilt, [ ] kart. The body only: no tires or driver. A close preview: check the final values in the game.</small>
  <label id="status">Changed karts: none</label>
  <textarea id="out" readonly></textarea>
</div></main>
<script>
const KARTS = /*KARTS*/null, BG = /*BG*/null;
const $ = i => document.getElementById(i);
const q = new URLSearchParams(location.search);
const BASE_FOVY = 70; /* the game's own view angle, fitted to screenshots */
$("bg").src = BG;
const gl = $("gl").getContext("webgl2", {alpha: true, premultipliedAlpha: false, antialias: true, preserveDrawingBuffer: true});
const prog = gl.createProgram();
const shader = (t, s) => { const h = gl.createShader(t); gl.shaderSource(h, s); gl.compileShader(h); gl.attachShader(prog, h); };
shader(gl.VERTEX_SHADER, `#version 300 es
uniform mat4 M; in vec3 p; in vec2 t; out vec2 v; out vec3 w; void main(){v=t;w=p;gl_Position=M*vec4(p,1.);}`);
shader(gl.FRAGMENT_SHADER, `#version 300 es
precision mediump float; uniform sampler2D s; in vec2 v; in vec3 w; out vec4 o;
void main(){vec4 c=texture(s,v); if(c.a<.5)discard; vec3 n=normalize(cross(dFdx(w),dFdy(w)));
float l=.75+.25*abs(n.y); o=vec4(c.rgb*l,1.);}`);
gl.linkProgram(prog); gl.useProgram(prog);
const A = {p: gl.getAttribLocation(prog, "p"), t: gl.getAttribLocation(prog, "t")}, UM = gl.getUniformLocation(prog, "M");
gl.enable(gl.DEPTH_TEST); gl.clearColor(0, 0, 0, 0);
const white = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, white);
gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([130, 130, 135, 255]));
for (const k of KARTS) for (const g of k.groups) {
  g.vao = gl.createVertexArray(); gl.bindVertexArray(g.vao); g.n = g.pos.length / 3;
  for (const [a, d, c] of [[A.p, g.pos, 3], [A.t, g.uv, 2]]) {
    gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer()); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(d), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(a); gl.vertexAttribPointer(a, c, gl.FLOAT, false, 0, 0);
  }
  g.tex = white;
  if (g.img) { const im = new Image(); im.onload = () => {
    g.tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, g.tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, im); gl.generateMipmap(gl.TEXTURE_2D); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.MIRRORED_REPEAT); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.MIRRORED_REPEAT);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR); draw(); }; im.src = g.img; }
}
const eyes = KARTS.map(k => ({up: k.up, fwd: k.fwd, tilt: k.tilt}));
try { const s = JSON.parse(localStorage.getItem("kart_fpv_eyes")); if (s && s.length === eyes.length) s.forEach((e, i) => Object.assign(eyes[i], e)); } catch (e) {}
let cur = +q.get("kart") || 0;
function view() { /* eye at (0, up, fwd), looking along +z and down by tilt; +x is on screen left */
  const k = eyes[cur], tilt = k.tilt * Math.PI / 180, c = Math.cos(tilt), s = Math.sin(tilt);
  const f = 1 / (Math.tan(BASE_FOVY * Math.PI / 360) * +$("fov").value), asp = 16 / 9, n = 8, r = 5000;
  const F = [0, -s, c], U = [0, c, s], R = [-1, 0, 0], e = [0, k.up - KARTS[cur].by, k.fwd - KARTS[cur].bz];
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const V = [R[0], U[0], -F[0], 0, R[1], U[1], -F[1], 0, R[2], U[2], -F[2], 0, -dot(R, e), -dot(U, e), dot(F, e), 1];
  const P = [f / asp, 0, 0, 0, 0, f, 0, 0, 0, 0, (r + n) / (n - r), -1, 0, 0, 2 * r * n / (n - r), 0];
  const M = new Float32Array(16);
  for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) for (let l = 0; l < 4; l++) M[i * 4 + j] += V[i * 4 + l] * P[l * 4 + j];
  return M;
}
function draw() {
  const k = eyes[cur];
  gl.viewport(0, 0, 1280, 720); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.uniformMatrix4fv(UM, false, view());
  for (const g of KARTS[cur].groups) { gl.bindVertexArray(g.vao); gl.bindTexture(gl.TEXTURE_2D, g.tex); gl.drawArrays(gl.TRIANGLES, 0, g.n); }
  /* the screenshot was taken at 10 degrees down: tilting moves the world the other way */
  const h = $("view").clientHeight, f = h / 2 / (Math.tan(BASE_FOVY * Math.PI / 360) * +$("fov").value);
  $("bg").style.transform = `translateY(${f * Math.tan((k.tilt - 10) * Math.PI / 180)}px) scale(${1.45 / +$("fov").value})`; /* taken at WIDEST */
  for (const p of ["up", "fwd", "tilt"]) { $(p).value = k[p]; $(p + "n").value = k[p]; }
  const lines = [];
  eyes.forEach((e, i) => { const o = KARTS[i]; if (e.up !== o.up || e.fwd !== o.fwd || e.tilt !== o.tilt) lines.push(`${i} ${o.name}: up ${e.up}, forward ${e.fwd}, tilt ${e.tilt}`); });
  $("out").value = lines.join("\n");
  $("status").textContent = "Changed karts: " + (lines.length || "none");
  $("status").className = lines.length ? "changed" : "";
  try { localStorage.setItem("kart_fpv_eyes", JSON.stringify(eyes)); } catch (e) {}
}
KARTS.forEach((k, i) => $("kart").add(new Option(i + " " + k.name, i)));
const go = i => { cur = (i + KARTS.length) % KARTS.length; $("kart").value = cur; draw(); };
const set = (p, v) => { if (Number.isFinite(v)) { eyes[cur][p] = Math.round(v); draw(); } };
for (const p of ["up", "fwd", "tilt"]) { $(p).oninput = e => set(p, +e.target.value); $(p + "n").oninput = e => set(p, +e.target.value); }
$("kart").onchange = e => go(+e.target.value); $("prev").onclick = () => go(cur - 1); $("next").onclick = () => go(cur + 1);
$("fov").onchange = draw;
$("reset").onclick = () => { const o = KARTS[cur]; Object.assign(eyes[cur], {up: o.up, fwd: o.fwd, tilt: o.tilt}); draw(); };
$("copy").onclick = () => navigator.clipboard && navigator.clipboard.writeText($("out").value);
addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" && e.target.type === "number") return;
  const k = eyes[cur], a = {ArrowUp: ["up", 1], ArrowDown: ["up", -1], ArrowRight: ["fwd", 1], ArrowLeft: ["fwd", -1], e: ["tilt", 1], q: ["tilt", -1]}[e.key];
  if (a) { set(a[0], k[a[0]] + a[1]); e.preventDefault(); }
  else if (e.key === "[") go(cur - 1); else if (e.key === "]") go(cur + 1);
});
addEventListener("resize", draw);
go(cur);
</script></body></html>
